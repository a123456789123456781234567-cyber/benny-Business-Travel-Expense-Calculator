<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機車差旅計價系統</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="app" class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- 未登入狀態：純登入區塊 -->
    <div v-if="!currentUser" class="max-w-md mx-auto my-12 bg-white p-8 rounded-3xl shadow-lg border border-slate-200">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-3 text-blue-600">
          <i class="fa-solid fa-motorcycle text-3xl"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-800">機車差旅計價系統</h2>
        <p class="text-xs text-slate-500 mt-2">請輸入您的帳號與密碼以登入 Firebase 系統</p>
      </div>

      <div v-if="authError" class="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-600 text-xs flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ authError }}</span>
      </div>

      <form @submit.prevent="handleLogin" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">電子郵件 / 帳號</label>
          <!-- 已改為 type="text"，不再強制檢查 Email 格式 -->
          <input type="text" v-model="authForm.email" required placeholder="請輸入 Email 或帳號" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">密碼</label>
          <input type="password" v-model="authForm.password" required placeholder="請輸入密碼" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow-sm mt-2">
          登入系統
        </button>
      </form>
    </div>

    <!-- 已登入狀態：主系統介面 -->
    <template v-else>
      <header class="mb-6 bg-white rounded-2xl shadow-sm p-4 sm:p-6 border border-slate-200">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-motorcycle text-blue-600 text-2xl"></i>
              <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">機車差旅計價系統</h1>
            </div>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
              第一頁純淨報銷明細（含適當 Excel 欄寬設定），第二頁全攤開每筆紀錄專屬 11 項參數。
            </p>
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <div class="flex items-center justify-between gap-3 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
              <div class="flex items-center gap-2 text-xs text-slate-700">
                <i class="fa-solid fa-circle-user text-blue-600 text-base"></i>
                <span>使用者：<strong class="font-bold text-slate-900">{{ currentUser.email || currentUser.uid }}</strong>
                  <span v-if="isAdmin" class="ml-1 px-1.5 py-0.5 text-[10px] bg-purple-100 text-purple-700 font-bold rounded">最高權限</span>
                </span>
              </div>
              <div class="flex items-center gap-2 border-l pl-3 border-slate-300">
                <button @click="handleLogout" class="text-xs text-rose-600 hover:text-rose-800 font-semibold transition">
                  <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
                </button>
              </div>
            </div>

            <nav class="flex bg-slate-100 p-1 rounded-xl">
              <button 
                @click="activeTab = 'calculator'"
                :class="['px-3 py-2 rounded-lg font-medium text-xs sm:text-sm transition flex items-center gap-1.5', activeTab === 'calculator' ? 'bg-white text-blue-600 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900']">
                <i class="fa-solid fa-calculator"></i>
                費用計算
              </button>
              <button 
                @click="activeTab = 'settings'"
                :class="['px-3 py-2 rounded-lg font-medium text-xs sm:text-sm transition flex items-center gap-1.5', activeTab === 'settings' ? 'bg-white text-blue-600 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900']">
                <i class="fa-solid fa-sliders"></i>
                耗損參數
              </button>
            </nav>
          </div>
        </div>
      </header>

      <!-- 頁籤一：差旅費用計算與明細 -->
      <main v-if="activeTab === 'calculator'" class="space-y-6">

        <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
          <div class="flex items-center gap-3 w-full md:w-auto">
            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
              <i class="fa-solid fa-file-excel text-xl"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-slate-800">月報銷總表管理</h3>
              <p class="text-xs text-slate-500">第一頁包含記錄與總金額，第二頁全攤開 11 項參數。</p>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
            <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
              <span class="text-xs text-slate-500 font-medium">報銷月份：</span>
              <input type="month" v-model="targetMonth" class="bg-transparent text-xs font-bold text-blue-600 focus:outline-none">
            </div>
          </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          
          <section class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
              <h2 class="text-base font-bold text-slate-800 border-l-4 border-blue-600 pl-3">
                {{ editingId ? '編輯單筆出差資訊' : '新增單筆出差資訊' }}
              </h2>
              <div class="flex items-center gap-3">
                <button v-if="editingId" @click="cancelEdit" class="text-xs text-rose-500 hover:text-rose-700 font-semibold transition">
                  <i class="fa-solid fa-xmark mr-1"></i>取消編輯
                </button>
                <button @click="resetInputs" class="text-xs text-slate-400 hover:text-slate-600 transition">
                  <i class="fa-solid fa-arrow-rotate-left mr-1"></i>重置欄位
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">出差事由 / 說明</label>
              <input type="text" v-model="purpose" placeholder="例如：拜訪客戶 XYZ 公司..." class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">出差日期</label>
                <input type="date" v-model="inputDate" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">選用汽油種類</label>
                <select v-model="selectedFuelType" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                  <option value="92">92 無鉛汽油</option>
                  <option value="95">95 無鉛汽油</option>
                  <option value="98">98 無鉛汽油</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">當週油價 (NT$)</label>
                <div class="relative">
                  <input type="number" step="0.1" min="0" v-model.number="fuelPrice" class="w-full p-3 border border-blue-200 bg-blue-50/20 rounded-xl text-sm font-semibold text-slate-800 pr-14 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                  <span class="absolute right-4 top-3.5 text-xs font-semibold text-slate-400">元/升</span>
                </div>
              </div>
            </div>

            <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-600 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-blue-500"></i>
                <span>關鍵字：<strong class="text-slate-800 font-mono">「中油 {{ inputDate }} 當週 {{ selectedFuelType }}無鉛汽油 歷史油價」</strong></span>
              </div>
              <a :href="googleSearchUrl" target="_blank" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-lg text-xs hover:bg-blue-700 transition flex items-center gap-1 shrink-0">
                <i class="fa-solid fa-magnifying-glass"></i>搜尋油價
              </a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">往返總里程 (km)</label>
                <input type="number" min="0" step="0.1" v-model.number="distance" placeholder="例如: 28.5" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">停車費 (NT$)</label>
                <input type="number" min="0" step="1" v-model.number="parkingFee" placeholder="0" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              </div>
            </div>

            <button v-if="!editingId" @click="saveRecord" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fa-solid fa-plus"></i>
              新增此筆紀錄
            </button>
            <button v-else @click="saveRecord" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
              <i class="fa-solid fa-floppy-disk"></i>
              儲存變更紀錄
            </button>
          </section>

          <section class="bg-gradient-to-br from-slate-900 to-blue-950 text-white p-6 rounded-2xl shadow-md flex flex-col justify-between border border-slate-800">
            <div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                  <i class="fa-solid fa-receipt text-yellow-400"></i>當筆試算 preview
                </h2>
              </div>
              
              <div class="space-y-3.5 text-xs sm:text-sm">
                <div class="flex justify-between items-center">
                  <span class="text-slate-400">當前耗損折舊成本</span>
                  <span class="font-semibold text-slate-200">NT$ {{ totalLossPerKm.toFixed(3) }} / km</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-400">預估汽油使用量</span>
                  <span class="font-semibold text-slate-200">{{ estimatedLiters.toFixed(2) }} 升</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-400">油價成本小計</span>
                  <span class="font-semibold">NT$ {{ fuelSubTotal.toFixed(1) }}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-400">折舊成本小計</span>
                  <span class="font-semibold">NT$ {{ lossSubTotal.toFixed(1) }}</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-slate-400">停車費（直接併入給付）</span>
                  <span class="font-semibold text-slate-200">NT$ {{ (parkingFee || 0).toFixed(0) }}</span>
                </div>
                <div class="pt-3 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                  <span>給付小計 (進位)</span>
                  <span class="text-base font-bold text-yellow-400 font-mono">NT$ {{ Math.ceil(totalCost) }}</span>
                </div>
              </div>
            </div>

            <div class="mt-8 pt-4 border-t border-slate-800 bg-slate-800/50 p-4 rounded-xl space-y-2">
              <div class="flex justify-between items-center text-xs">
                <span class="text-slate-300">當月報銷筆數：</span>
                <span class="font-bold text-slate-100 font-mono">{{ filteredRecords.length }} 筆</span>
              </div>
              <div class="flex justify-between items-center text-xs">
                <span class="text-slate-300">當月總里程：</span>
                <span class="font-bold text-slate-100 font-mono">{{ monthTotalKm.toFixed(1) }} km</span>
              </div>
              <div class="pt-2 border-t border-slate-700/60 flex justify-between items-baseline">
                <span class="text-xs font-bold text-yellow-400">當月總金額：</span>
                <span class="text-2xl font-extrabold text-yellow-400 font-mono">NT$ {{ monthTotalAmount }}</span>
              </div>
            </div>
          </section>

        </div>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3 border-slate-100">
            <div>
              <h2 class="text-base font-bold text-slate-800 border-l-4 border-emerald-600 pl-3">
                {{ targetMonth }} 月份差旅明細
              </h2>
            </div>

            <div class="flex items-center gap-2">
              <button @click="exportToExcel" :disabled="filteredRecords.length === 0" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-300 text-white font-semibold rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-excel"></i>
                匯出 Excel 月總表
              </button>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm border-collapse">
              <thead class="bg-slate-50 text-slate-600 border-y border-slate-200 font-semibold">
                <tr>
                  <th class="py-3 px-3">出差日期</th>
                  <th class="py-3 px-3">出差事由</th>
                  <th class="py-3 px-3 text-right">里程(km)</th>
                  <th class="py-3 px-3 text-right">折舊單價/km</th>
                  <th class="py-3 px-3 text-right">油耗與折舊成本</th>
                  <th class="py-3 px-3 text-right">停車費</th>
                  <th class="py-3 px-3 text-right">給付金額</th>
                  <th class="py-3 px-3 text-center">操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                <tr v-if="filteredRecords.length === 0">
                  <td colspan="8" class="py-8 text-center text-slate-400">目前尚無任何紀錄</td>
                </tr>
                <tr v-for="item in filteredRecords" :key="item.id" :class="['hover:bg-slate-50/80 transition', editingId === item.id ? 'bg-amber-50/60' : '']">
                  <td class="py-2.5 px-3 font-mono">{{ item.date }}</td>
                  <td class="py-2.5 px-3">{{ item.purpose }}</td>
                  <td class="py-2.5 px-3 text-right font-mono">{{ item.distance }}</td>
                  <td class="py-2.5 px-3 text-right font-mono text-slate-500">NT$ {{ (item.lossPerKm || 0).toFixed(3) }}</td>
                  <td class="py-2.5 px-3 text-right font-mono">NT$ {{ item.calcCost }}</td>
                  <td class="py-2.5 px-3 text-right font-mono">NT$ {{ item.parkingFee }}</td>
                  <td class="py-2.5 px-3 text-right font-mono font-bold text-blue-600">NT$ {{ item.finalPay }}</td>
                  <td class="py-2.5 px-3 text-center">
                    <div class="flex items-center justify-center gap-2">
                      <button @click="editRecord(item)" class="text-amber-500 hover:text-amber-700 p-1" title="修改">
                        <i class="fa-regular fa-pen-to-square"></i>
                      </button>
                      <button @click="deleteRecord(item.id)" class="text-rose-400 hover:text-rose-600 p-1" title="刪除">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
              <tfoot v-if="filteredRecords.length > 0" class="bg-slate-100/90 border-t-2 border-slate-300 font-bold text-slate-800">
                <tr>
                  <td class="py-3 px-3 font-mono text-slate-800">TOTAL 當月合計</td>
                  <td class="py-3 px-3"></td>
                  <td class="py-3 px-3 text-right font-mono text-blue-700">{{ monthTotalKm.toFixed(1) }}</td>
                  <td class="py-3 px-3"></td>
                  <td class="py-3 px-3 text-right font-mono">NT$ {{ monthTotalCalcCost.toFixed(1) }}</td>
                  <td class="py-3 px-3 text-right font-mono">NT$ {{ monthTotalParkingFee }}</td>
                  <td class="py-3 px-3 text-right font-mono text-blue-700 text-base">NT$ {{ monthTotalAmount }}</td>
                  <td class="py-3 px-3"></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </section>

      </main>

      <!-- 頁籤二：耗損與折舊參數 -->
      <main v-if="activeTab === 'settings'" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3 border-slate-100">
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-base font-bold text-slate-800 border-l-4 border-blue-600 pl-3">預設耗損與折舊參數</h2>
            </div>
            <p class="text-xs text-slate-500 mt-1">修改後的預設值會即時同步至 Firebase 並作為未來新增紀錄時的基準。</p>
          </div>

          <button @click="resetDefaults" class="text-xs text-rose-600 hover:bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg transition">
            恢復預設值
          </button>
        </div>

        <!-- 機車平均油耗設定 -->
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
          <h3 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-gas-pump text-blue-600"></i> 機車油耗預設參數
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">機車平均油耗預設</label>
              <select v-model="fuelPreset" @change="onPresetChange" class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="45">省油型 (45 km/L)</option>
                <option value="35">標準型 (35 km/L)</option>
                <option value="25">耗油型/重機 (25 km/L)</option>
                <option value="custom">自訂油耗數值</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">每公升可行駛里程 (km/L)</label>
              <div class="relative">
                <input type="number" min="1" step="0.1" v-model.number="fuelEfficiency" :disabled="fuelPreset !== 'custom'" class="w-full p-3 border border-slate-300 rounded-xl text-sm pr-14 disabled:bg-slate-100 disabled:text-slate-500 disabled:cursor-not-allowed focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <span class="absolute right-4 top-3.5 text-xs font-semibold text-slate-400">km/L</span>
              </div>
            </div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-50 text-slate-600 border-y border-slate-200 font-semibold">
              <tr>
                <th class="py-3 px-3">耗損 / 折舊項目</th>
                <th class="py-3 px-3">單次費用 (NT$)</th>
                <th class="py-3 px-3">壽命週期 (km)</th>
                <th class="py-3 px-3 text-right">每公里分派成本</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              <tr v-for="(item, index) in defaultMaintenanceItems" :key="index">
                <td class="py-2.5 px-3 font-medium text-slate-700">{{ item.name }}</td>
                <td class="py-2.5 px-3">
                  <input type="number" min="0" v-model.number="item.cost" @change="saveUserSettings" class="w-28 p-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-blue-500">
                </td>
                <td class="py-2.5 px-3">
                  <input type="number" min="1" v-model.number="item.interval" @change="saveUserSettings" class="w-28 p-1.5 border border-slate-300 rounded-lg text-xs focus:ring-1 focus:ring-blue-500">
                </td>
                <td class="py-2.5 px-3 text-right font-mono">
                  NT$ {{ (item.interval > 0 ? (item.cost / item.interval) : 0).toFixed(4) }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </template>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 已替換為您的專屬 Firebase 金鑰配置
    const firebaseConfig = {
      apiKey: "AIzaSyDIC-j_HHmCey4RbmM4sckK5u4v0OP9Yks",
      authDomain: "travel-expense-calculato-b4125.firebaseapp.com",
      projectId: "travel-expense-calculato-b4125",
      storageBucket: "travel-expense-calculato-b4125.firebasestorage.app",
      messagingSenderId: "546762800669",
      appId: "1:546762800669:web:59d1bb9c3a9b763c58d0f4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const { createApp, ref, computed, watch, onMounted } = Vue;

    createApp({
      setup() {
        const activeTab = ref('calculator');
        const currentUser = ref(null);
        const authError = ref('');
        const authForm = ref({ email: '', password: '' });
        const isAdmin = ref(false);

        const initialItems = [
          { name: "機油", cost: 400, interval: 1000 },
          { name: "齒輪油", cost: 50, interval: 2500 },
          { name: "空氣濾清器", cost: 300, interval: 4000 },
          { name: "火星塞", cost: 250, interval: 10000 },
          { name: "前後輪胎 (一組)", cost: 2500, interval: 10000 },
          { name: "煞車系統 (皮/油)", cost: 1200, interval: 12500 },
          { name: "傳動系統組件", cost: 2800, interval: 17500 },
          { name: "電瓶 (蓄電池)", cost: 1000, interval: 20000 },
          { name: "大保養清潔", cost: 2000, interval: 15000 },
          { name: "避震器與管線老化", cost: 3000, interval: 30000 },
          { name: "購車本體折舊", cost: 70000, interval: 60000 }
        ];

        const defaultMaintenanceItems = ref(JSON.parse(JSON.stringify(initialItems)));
        const records = ref([]);

        let unsubscribeRecords = null;

        // 監聽 Firebase 驗證狀態變更
        onAuthStateChanged(auth, async (user) => {
          currentUser.value = user;
          if (user) {
            fetchUserSettings(user.uid);
            subscribeRecords(user.uid);
          } else {
            records.value = [];
            if (unsubscribeRecords) unsubscribeRecords();
          }
        });

        const handleLogin = async () => {
          authError.value = '';
          try {
            // 如果輸入純帳號名稱且未含 @，補上預設網域以滿足 Firebase Auth 的 Email 格式驗證
            let loginEmail = authForm.value.email.trim();
            if (!loginEmail.includes('@')) {
              loginEmail = `${loginEmail}@yourdomain.com`;
            }

            await signInWithEmailAndPassword(auth, loginEmail, authForm.value.password);
            authForm.value = { email: '', password: '' };
          } catch (err) {
            authError.value = '登入失敗：' + err.message;
          }
        };

        const handleLogout = async () => {
          await signOut(auth);
        };

        // 即時監聽 Firestore 中的差旅紀錄
        const subscribeRecords = (uid) => {
          if (unsubscribeRecords) unsubscribeRecords();
          const q = query(collection(db, "travel_records"), where("uid", "==", uid));
          unsubscribeRecords = onSnapshot(q, (snapshot) => {
            records.value = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          });
        };

        // 讀取設定檔
        const fetchUserSettings = async (uid) => {
          const docRef = doc(db, "user_settings", uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists() && docSnap.data().items) {
            defaultMaintenanceItems.value = docSnap.data().items;
          }
        };

        // 儲存設定檔至 Firestore
        const saveUserSettings = async () => {
          if (!currentUser.value) return;
          const docRef = doc(db, "user_settings", currentUser.value.uid);
          await setDoc(docRef, { items: defaultMaintenanceItems.value }, { merge: true });
        };

        const resetDefaults = async () => {
          defaultMaintenanceItems.value = JSON.parse(JSON.stringify(initialItems));
          await saveUserSettings();
        };

        // 表單與計算邏輯
        const getCurrentMonthStr = () => {
          const now = new Date();
          return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        };
        const getTodayStr = () => {
          const now = new Date();
          return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        };

        const targetMonth = ref(getCurrentMonthStr());
        const purpose = ref('');
        const inputDate = ref(getTodayStr());
        const selectedFuelType = ref('95');
        const fuelPrice = ref(31.0);
        const distance = ref(0);
        const parkingFee = ref(0);
        const fuelPreset = ref('35');
        const fuelEfficiency = ref(35.0);
        const editingId = ref(null);

        const onPresetChange = () => {
          if (fuelPreset.value !== 'custom') {
            fuelEfficiency.value = parseFloat(fuelPreset.value);
          }
        };

        const googleSearchUrl = computed(() => {
          const query = `中油 ${inputDate.value} 當週 ${selectedFuelType.value}無鉛汽油 歷史油價`;
          return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        });

        const totalLossPerKm = computed(() => {
          return defaultMaintenanceItems.value.reduce((sum, item) => sum + (item.interval > 0 ? (item.cost / item.interval) : 0), 0);
        });

        const estimatedLiters = computed(() => (distance.value && fuelEfficiency.value) ? distance.value / fuelEfficiency.value : 0);
        const fuelSubTotal = computed(() => estimatedLiters.value * (fuelPrice.value || 0));
        const lossSubTotal = computed(() => (distance.value || 0) * totalLossPerKm.value);
        const totalCost = computed(() => fuelSubTotal.value + lossSubTotal.value + (parkingFee.value || 0));

        const filteredRecords = computed(() => {
          return records.value
            .filter(r => r.date && r.date.startsWith(targetMonth.value))
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        });

        const monthTotalKm = computed(() => filteredRecords.value.reduce((sum, item) => sum + (Number(item.distance) || 0), 0));
        const monthTotalCalcCost = computed(() => filteredRecords.value.reduce((sum, item) => sum + (Number(item.calcCost) || 0), 0));
        const monthTotalParkingFee = computed(() => filteredRecords.value.reduce((sum, item) => sum + (Number(item.parkingFee) || 0), 0));
        const monthTotalAmount = computed(() => filteredRecords.value.reduce((sum, item) => sum + (Number(item.finalPay) || 0), 0));

        const saveRecord = async () => {
          if (!distance.value || distance.value <= 0) {
            alert('請輸入有效的出差往返總里程！');
            return;
          }

          const recordData = {
            uid: currentUser.value.uid,
            date: inputDate.value,
            purpose: purpose.value || '未填寫',
            distance: distance.value,
            fuelType: `${selectedFuelType.value}無鉛`,
            fuelPrice: fuelPrice.value,
            efficiency: fuelEfficiency.value,
            lossPerKm: totalLossPerKm.value,
            snapshotItems: JSON.parse(JSON.stringify(defaultMaintenanceItems.value)),
            calcCost: (fuelSubTotal.value + lossSubTotal.value).toFixed(1),
            parkingFee: parkingFee.value || 0,
            finalPay: Math.ceil(totalCost.value)
          };

          if (editingId.value) {
            await updateDoc(doc(db, "travel_records", editingId.value), recordData);
          } else {
            await addDoc(collection(db, "travel_records"), recordData);
          }

          cancelEdit();
        };

        const editRecord = (item) => {
          editingId.value = item.id;
          inputDate.value = item.date;
          purpose.value = item.purpose === '未填寫' ? '' : item.purpose;
          distance.value = item.distance;
          
          const rawFuelType = item.fuelType ? item.fuelType.replace('無鉛', '') : '95';
          selectedFuelType.value = ['92', '95', '98'].includes(rawFuelType) ? rawFuelType : '95';
          
          fuelPrice.value = item.fuelPrice;
          fuelEfficiency.value = item.efficiency;
          parkingFee.value = item.parkingFee;
        };

        const cancelEdit = () => {
          editingId.value = null;
          resetInputs();
        };

        const deleteRecord = async (id) => {
          if (confirm('確定要刪除此筆紀錄嗎？')) {
            await deleteDoc(doc(db, "travel_records", id));
            if (editingId.value === id) cancelEdit();
          }
        };

        const resetInputs = () => {
          purpose.value = '';
          inputDate.value = getTodayStr();
          distance.value = 0;
          parkingFee.value = 0;
          fuelPreset.value = '35';
          fuelEfficiency.value = 35.0;
        };

        const exportToExcel = () => {
          const workbook = XLSX.utils.book_new();

          const detailData = filteredRecords.value.map(item => ({
            "出差日期": item.date,
            "出差事由": item.purpose,
            "里程(km)": item.distance,
            "汽油種類": item.fuelType,
            "當週油價": item.fuelPrice,
            "油耗(km/L)": item.efficiency,
            "折舊單價(元/km)": Number(item.lossPerKm.toFixed(4)),
            "油耗與折舊成本": Number(item.calcCost),
            "停車費": Number(item.parkingFee),
            "給付金額": Number(item.finalPay)
          }));

          detailData.push({
            "出差日期": "TOTAL 當月合計",
            "出差事由": "",
            "里程(km)": Number(monthTotalKm.value.toFixed(1)),
            "汽油種類": "",
            "當週油價": "",
            "油耗(km/L)": "",
            "折舊單價(元/km)": "",
            "油耗與折舊成本": Number(monthTotalCalcCost.value.toFixed(1)),
            "停車費": monthTotalParkingFee.value,
            "給付金額": monthTotalAmount.value
          });

          const ws1 = XLSX.utils.json_to_sheet(detailData);
          ws1['!cols'] = [
            { wch: 18 }, { wch: 25 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, 
            { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 14 }
          ];
          XLSX.utils.book_append_sheet(workbook, ws1, "差旅報銷明細");

          XLSX.writeFile(workbook, `機車差旅費用月總表_${targetMonth.value}.xlsx`);
        };

        return {
          activeTab, currentUser, authError, authForm, isAdmin, handleLogin, handleLogout,
          targetMonth, purpose, inputDate, selectedFuelType, fuelPrice, fuelPreset, fuelEfficiency,
          distance, parkingFee, editingId, defaultMaintenanceItems, googleSearchUrl, totalLossPerKm,
          estimatedLiters, fuelSubTotal, lossSubTotal, totalCost, filteredRecords, monthTotalKm,
          monthTotalCalcCost, monthTotalParkingFee, monthTotalAmount, onPresetChange, saveRecord,
          editRecord, cancelEdit, deleteRecord, resetInputs, resetDefaults, saveUserSettings, exportToExcel
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
