<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差旅里程與油價試算系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">

  <div id="app" class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6 border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">
      🚗 差旅里程與油資試算
    </h1>

    <div class="space-y-5">
      <!-- 1. 出差日期 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">📅 出差日期</label>
        <input 
          type="date" 
          v-model="travelDate" 
          class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- 2. 手動輸入當週油價 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">⛽ 當週中油每升油價 (元)</label>
        <div class="relative">
          <input 
            type="number" 
            v-model.number="fuelPrice" 
            min="0"
            step="0.1"
            placeholder="請輸入油價，例如：32.0"
            class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none pr-12"
          />
          <span class="absolute right-3 top-2.5 text-gray-400">元/升</span>
        </div>
      </div>

      <!-- 3. 車輛類型 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">🛵 / 🚗 車輛類型</label>
        <select 
          v-model="vehicleType" 
          class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        >
          <option value="scooter">普通重型機車 (參考油耗 35 km/L)</option>
          <option value="car">一般汽油轎車 (參考油耗 12 km/L)</option>
        </select>
      </div>

      <!-- 4. 行駛里程 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">📏 行駛里程 (km)</label>
        <div class="relative">
          <input 
            type="number" 
            v-model.number="distance" 
            min="0"
            step="0.1"
            placeholder="請輸入里程數"
            class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none pr-12"
          />
          <span class="absolute right-3 top-2.5 text-gray-400">km</span>
        </div>
      </div>

      <!-- 結果顯示區 -->
      <div class="mt-8 p-5 bg-blue-50 rounded-xl border border-blue-100 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-600">📅 出差日期：</span>
          <span class="font-mono text-gray-800 font-medium">{{ travelDate || '未設定' }}</span>
        </div>

        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-600">🏷️ 輸入每升牌價：</span>
          <span class="font-semibold text-blue-900 text-base">NT$ {{ (fuelPrice || 0).toFixed(1) }} / 升</span>
        </div>

        <hr class="border-blue-200 my-2" />

        <div class="flex justify-between items-center">
          <span class="text-gray-700 font-bold">💰 預估油資補助金額：</span>
          <span class="text-2xl font-black text-blue-600">NT$ {{ calculatedCost }}</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        // 預設取得今天日期 YYYY-MM-DD
        const today = new Date().toISOString().split('T')[0];

        const travelDate = ref(today);
        const fuelPrice = ref(32.0); // 預設油價範例
        const vehicleType = ref('car');
        const distance = ref(0);

        // 計算補助金額
        const calculatedCost = computed(() => {
          if (!distance.value || distance.value <= 0 || !fuelPrice.value || fuelPrice.value <= 0) {
            return 0;
          }
          // 每公里耗油量 (km/L)
          const kmPerLiter = vehicleType.value === 'scooter' ? 35 : 12;
          const litersNeeded = distance.value / kmPerLiter;
          
          return Math.round(litersNeeded * fuelPrice.value);
        });

        return {
          travelDate,
          fuelPrice,
          vehicleType,
          distance,
          calculatedCost
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
